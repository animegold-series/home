<!DOCTYPE html>
<html>
<head>
  <title>AnimeGold - Earn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(-45deg, #1a0033, #2d0052, #0a0a2e, #16213e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow-y: auto;
      padding: 20px 0;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 152, 0, 0.5);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 80%; top: 80%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 50%; top: 50%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 20%; top: 70%; animation-delay: 6s; }
    .particle:nth-child(5) { left: 90%; top: 30%; animation-delay: 8s; }
    .particle:nth-child(6) { left: 30%; top: 10%; animation-delay: 10s; }
    .particle:nth-child(7) { left: 70%; top: 60%; animation-delay: 12s; }
    .particle:nth-child(8) { left: 15%; top: 50%; animation-delay: 14s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(100px, -100px) scale(0.5); opacity: 0; }
    }

    .section {
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 152, 0, 0.3);
      box-shadow: 0 8px 32px rgba(255, 152, 0, 0.2), 0 0 50px rgba(255, 152, 0, 0.1);
      padding: 40px 35px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      animation: slideUp 0.8s ease-out;
      z-index: 1;
      margin: 20px auto;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff9800, #ffb84d, #ff6b00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
      animation: glow 2s ease-in-out infinite;
      font-weight: bold;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 152, 0, 0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 152, 0, 0.8)); }
    }

    p {
      color: #b0b0ff;
      margin-bottom: 15px;
      font-size: 0.95em;
      letter-spacing: 0.5px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }

    .stat-box {
      background: rgba(255, 152, 0, 0.1);
      border: 2px solid rgba(255, 152, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .stat-box:hover {
      background: rgba(255, 152, 0, 0.15);
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
    }

    .stat-label {
      font-size: 12px;
      color: #b0b0ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #ff9800;
    }

    .rewards-section {
      margin: 25px 0;
      text-align: left;
    }

    .reward-button {
      width: 100%;
      margin: 10px 0;
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff9800, #ffb84d);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .reward-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 152, 0, 0.6);
      background: linear-gradient(135deg, #ffb84d, #ff9800);
    }

    .reward-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(255, 152, 0, 0.4);
    }

    button {
      width: 100%;
      margin: 15px 0;
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff9800, #ffb84d);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 152, 0, 0.6);
      background: linear-gradient(135deg, #ffb84d, #ff9800);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(255, 152, 0, 0.4);
    }

    .error {
      color: #ff4444;
      font-size: 14px;
      margin: 10px 0;
      min-height: 20px;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 152, 0, 0.9);
      color: #000;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.5);
      z-index: 100;
      animation: slideInRight 0.5s ease-out;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .nav-buttons button {
      flex: 1;
      margin: 0;
      font-size: 13px;
      padding: 10px 15px;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="section">
    <h1>⚡ AnimeGold - Earn</h1>
    <p>Watch and Earn Rewards</p>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Points</div>
        <div class="stat-value" id="pointsDisplay">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Pending Earnings</div>
        <div class="stat-value" id="earningsDisplay">₱0</div>
      </div>
    </div>

    <div class="rewards-section">
      <p style="text-align: center; color: #ffb84d; font-weight: bold;">Claim Your Rewards</p>
      <button class="reward-button" onclick="window.claimReward(10)">Claim ₱10</button>
      <button class="reward-button" onclick="window.claimReward(50)">Claim ₱50</button>
      <button class="reward-button" onclick="window.claimReward(100)">Claim ₱100</button>
    </div>

    <div id="errorMessage" class="error"></div>

    <div class="nav-buttons">
      <button onclick="window.location.href='payout.html'">Payout Info</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userData = null;
    let userRef = null;
    let minuteCounter = 0;

    // Show notification
    function showNotification(message) {
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.innerText = message;
      document.body.appendChild(notification);
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    // Update UI
    async function updateUI() {
      if (!userData) return;
      document.getElementById('pointsDisplay').innerText = Math.floor(minuteCounter / 300) || 0;
      document.getElementById('earningsDisplay').innerText = '₱' + (userData.pendingEarnings || 0);
    }

    // Check auth and load user data
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("You must be logged in!");
        window.location.href = "index.html";
        return;
      }

      // Get username from localStorage or Firestore
      const storedUsername = localStorage.getItem("username");
      if (!storedUsername) {
        const querySnapshot = await getDoc(doc(db, "users", user.email));
        if (!querySnapshot.exists()) {
          alert("User data not found!");
          window.location.href = "index.html";
          return;
        }
      }

      const username = storedUsername || user.email;
      userRef = doc(db, "users", username);
      
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        userData = snap.data();
        minuteCounter = userData.minuteCounter || 0;
        updateUI();
      }
    });

    // ✅ FIXED: Properly check for payment info and refresh userData
    window.claimReward = async (cost) => {
      if (!userData || !userRef) {
        alert("❌ Please wait while loading...");
        return;
      }

      // ✅ Refresh userData from database first
      try {
        const snap = await getDoc(userRef);
        if (snap.exists()) {
          userData = snap.data();
          minuteCounter = userData.minuteCounter || 0;
        }
      } catch (err) {
        console.error("Error refreshing user data:", err);
      }

      const pts = minuteCounter / 300;

      // ✅ Check if payment info is set
      if (!userData.payoutMethod || !userData.payoutNumber || !userData.payoutName) {
        alert("❌ Please set up your payout info first!");
        window.location.href = "payout.html";
        return;
      }

      if (pts >= cost) {
        const newPending = (userData.pendingEarnings || 0) + cost;
        minuteCounter -= cost * 300;
        await setDoc(userRef, { minuteCounter, pendingEarnings: newPending }, { merge: true });
        
        const displayName = userData.userName || "User";
        showNotification(`🎉 ${displayName} claimed ₱${cost}!`);
        
        alert("✅ ₱" + cost + " added to Pending Earnings for " +
              displayName + " via " + userData.payoutMethod + "!");
        
        // ✅ Refresh UI to show updated data
        await updateUI();
      } else {
        alert("❌ Not enough points yet!");
      }
    };

    // Logout function
    window.logout = async () => {
      await signOut(auth);
      alert("Logged out successfully!");
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
